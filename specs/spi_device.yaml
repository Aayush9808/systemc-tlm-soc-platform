device:
  name: SPI_DEVICE
  version: 1
  address_width: 32
  register_width: 32

registers:
  - name: CONTROL
    offset: 0x00
    access: RW
    reset: 0x00000000

  - name: CFG
    offset: 0x04
    access: RW
    reset: 0x00000000

  - name: STATUS
    offset: 0x08
    access: RO
    reset: 0x00000000

  - name: TX
    offset: 0x0C
    access: WO
    reset: 0x00000000

  - name: RX
    offset: 0x10
    access: RO
    reset: 0x00000000