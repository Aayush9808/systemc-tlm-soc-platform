device:
  name: IRQ
  version: 1
  address_width: 32
  register_width: 32

registers:
  - name: PENDING
    offset: 0x00
    access: RW
    reset: 0x00000000

  - name: ENABLE
    offset: 0x04
    access: RW
    reset: 0x00000000

  - name: CLAIM
    offset: 0x08
    access: RO
    reset: 0x00000000

  - name: COMPLETE
    offset: 0x0C
    access: WO
    reset: 0x00000000
