device:
  name: UART0
  version: 1
  address_width: 32
  register_width: 32

registers:
  - name: CTRL
    offset: 0x00
    access: RW
    reset: 0x00000000
    mask: 0x00000003

  - name: STATUS
    offset: 0x04
    access: RO
    reset: 0x00000000

  - name: RDATA
    offset: 0x08
    access: RO
    reset: 0x00000000

  - name: WDATA
    offset: 0x0C
    access: WO
    reset: 0x00000000

  - name: FIFO_CTRL
    offset: 0x10
    access: RW
    reset: 0x00000000

  - name: FIFO_STATUS
    offset: 0x14
    access: RO
    reset: 0x00000000

  - name: INTR_STATE
    offset: 0x18
    access: W1C
    reset: 0x00000000

  - name: INTR_ENABLE
    offset: 0x1C
    access: RW
    reset: 0x00000000